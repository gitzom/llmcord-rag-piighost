# pipeline.toml, the server's default piighost configuration with one change being a custom model.

name = "piighost-api-default"

[detector]
type = "composite"

[[detector.detectors]]
type = "llm"
model = "gabriellarson/Anonymizer-0.6B-GGUF"
labels = ["PERSON", "EMAIL", "PHONE", "ID", "SECRET", "CREDIT_CARD", "DATE", "LOCATION", "ORGANIZATION", "URL", "IP"]
#model_provider = "huggingface"
#max_chars = 2000

[[detector.detectors]]
type = "regex"
catalogs = [
    "catalog:piighost/logs:b635d867",
