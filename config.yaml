# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: 

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: true
allow_dms: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  anythingllm:
    base_url: http://localhost:3001/api/v1/openai
    api_key_env: ANYTHINGLLM_API_KEY
  nanogpt:
    base_url: http://127.0.0.1:8000/openai/v1
    api_key_env: NANOGPT_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  x-ai:
    base_url: https://api.x.ai/v1
    api_key_env: X_AI_API_KEY

  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY

  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    api_key_env: AZURE_OPENAI_API_KEY
    extra_query:
      api-version: 2024-12-01-preview

  lmstudio:
    base_url: http://localhost:1234/v1

  ollama:
    base_url: http://localhost:11434/v1

  vllm:
    base_url: http://localhost:8000/v1

models:
  nanogpt/z-AI/GLM-5.2:

  anythingllm/saimmycontext:


  
  openai/gpt-5.5:
    reasoning_effort: high
    verbosity: medium

  openrouter/~anthropic/claude-opus-latest:
    tools:
      - type: openrouter:web_search
      - type: openrouter:web_fetch

  ollama/llama4:

system_prompt: | 
  This is a test to see if redaction is working. What's the first letter the name Jane Doe? If you can't answer, because it looks redacted, then you should say "I cannot answer that because it looks redacted." If you can answer, then you should answer. This message may be followed up by some memories. That's just the RAG system. Tell me if those are censored, too.