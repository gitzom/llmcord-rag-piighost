services:
  piighost-api:
    container_name: piighost-api
    image: ghcr.io/athroniaeth/piighost-api:latest
    ports:
      - "8000:8000"
    environment:
      - API_KEY_DEV=${API_KEY_DEV}
      - SECRET_PEPPER=${SECRET_PEPPER}
      - PIIGHOST_CONFIG=/app/pipeline.toml
      - EXTRA_PACKAGES=piighost[gliner2] piighost[llm]
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - API_KEY_default=${API_KEY}
      - PIIGHOST_ALLOW_ANONYMOUS=${PIIGHOST_ALLOW_ANONYMOUS:-}
      - PIIGHOST_MAX_BODY_BYTES=${PIIGHOST_MAX_BODY_BYTES:-1000000}
      - PIIGHOST_RATE_LIMIT=${PIIGHOST_RATE_LIMIT:-}
      - PIIGHOST_OPENAI_UPSTREAM=${PIIGHOST_OPENAI_UPSTREAM:-https://nano-gpt.com/api/v1legacy}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PIIGHOST_OPENAI_ANONYMIZE_SYSTEM=true
      
    volumes:
      - ./pipeline.toml:/app/pipeline.toml
      - piighost-uv-cache:/root/.cache/uv
      - piighost-hf-cache:/root/.cache/huggingface
#    deploy:
#     resources:
